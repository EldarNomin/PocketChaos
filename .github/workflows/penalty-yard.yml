name: Penalty Yard checks

on:
  push:
    paths:
      - 'games/penalty-yard/**'
      - '.github/workflows/penalty-yard.yml'
      - 'tools/package_windows.py'
      - 'tools/test_network_processes.py'
  pull_request:
    paths:
      - 'games/penalty-yard/**'
      - '.github/workflows/penalty-yard.yml'
      - 'tools/package_windows.py'
      - 'tools/test_network_processes.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned Godot 4.5.1
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9  /tmp/godot.zip' | sha512sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import, run and test
        working-directory: games/penalty-yard
        shell: bash
        run: |
          set -euo pipefail
          engine=Godot_v4.5.1-stable_linux.x86_64
          timeout 120s "$engine" --headless --editor --import 2>&1 | tee /tmp/import.log
          timeout 60s "$engine" --headless --quit-after 30 2>&1 | tee /tmp/smoke.log
          timeout 60s "$engine" --headless --script tests/test_rules.gd 2>&1 | tee /tmp/rules.log
          timeout 60s "$engine" --headless --script tests/test_game.gd 2>&1 | tee /tmp/scene.log
          timeout 60s "$engine" --headless --script tests/test_match.gd 2>&1 | tee /tmp/match.log
          timeout 90s "$engine" --headless --script tests/test_network.gd 2>&1 | tee /tmp/network.log
          timeout 90s "$engine" --headless --script tests/test_network.gd -- --latency 2>&1 | tee /tmp/latency.log
          timeout 60s "$engine" --headless --script tests/test_field.gd 2>&1 | tee /tmp/field.log
          timeout 90s "$engine" --headless --script tests/test_network_build.gd 2>&1 | tee /tmp/build.log
          timeout 90s "$engine" --headless --script tests/test_network_build.gd -- --latency 2>&1 | tee /tmp/build-latency.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/import.log /tmp/smoke.log /tmp/rules.log /tmp/scene.log /tmp/match.log /tmp/network.log /tmp/latency.log /tmp/field.log /tmp/build.log /tmp/build-latency.log; then exit 1; fi
      - name: Test two independent processes
        run: python3 tools/test_network_processes.py Godot_v4.5.1-stable_linux.x86_64
      - name: Package Windows preview
        run: python3 tools/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: penalty-yard-stage-4-windows
          path: builds/penalty-yard-stage-4-windows.zip
          compression-level: 0
          retention-days: 14
